[project]
name = "topic-pulse-v2"
version = "0.1.0"
description = "A Python scaffold for agent development."
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "apscheduler>=3.10",
    "beautifulsoup4>=4.12",
    "fastapi>=0.115",
    "requests>=2.31",
    "uvicorn[standard]>=0.30",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
